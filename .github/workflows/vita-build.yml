name: Vita Build

on:
  push:
    branches: [main]
    paths:
      - "port/vita/**"
      - "port/linux/src/**"
      - "port/linux/include/**"
      - "source/**"
      - "tools/vita_*.py"
      - ".github/workflows/vita-build.yml"
  workflow_dispatch:

jobs:
  vita:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4
      - name: Configure Vita target
        run: cmake -S port/vita -B build/vita -G Ninja
      - name: Build VPK
        run: cmake --build build/vita --target vita_vpk -j2
      - name: Upload Vita test package and symbols
        uses: actions/upload-artifact@v4
        with:
          name: HaloCEVita-main-${{ github.sha }}
          path: |
            build/vita/HaloCE.vpk
            build/vita/HaloCE.elf
            build/vita/HaloCE.elf.map
          if-no-files-found: error
          retention-days: 14

  prerelease:
    name: Publish Vita pre-release
    needs: vita
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Vita package
        uses: actions/download-artifact@v4
        with:
          name: HaloCEVita-main-${{ github.sha }}
          path: release
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vita-build-${{ github.run_number }}
          name: HaloCEVita Vita Build #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/HaloCE.vpk
            release/HaloCE.elf
            release/HaloCE.elf.map

  renderer-closure:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4
      - name: Configure original UI renderer link probe
        run: cmake -S port/vita -B build/vita-render-probe -G Ninja -DHALO_VITA_MENU_RENDER_PROBE=ON
      - name: Link original UI renderer closure
        run: cmake --build build/vita-render-probe --target HaloCE.elf -j2
