name: Vita Build

on:
  push:
    branches: [main]
    paths:
      - "port/vita/**"
      - "port/linux/src/**"
      - "port/linux/include/**"
      - "source/**"
      - "tools/vita_*.py"
      - ".github/workflows/vita-build.yml"
  workflow_dispatch:

jobs:
  menu-audio-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check original texture and 2D sound contracts
        run: |
          python3 tools/vita_texture_stage_regression.py
          python3 tools/vita_texture_upload_regression.py
          python3 tools/vita_dxt_mask_regression.py
          python3 tools/vita_vertex_color_regression.py
          python3 tools/vita_menu_clock_regression.py
          python3 tools/vita_sound_tag_regression.py
          python3 tools/vita_menu_regression.py
          python3 tools/vita_ui_input_regression.py
          python3 tools/vita_ui_effects_regression.py
          python3 tools/vita_ui_shell_regression.py
          python3 tools/vita_xapi_regression.py
          python3 tools/vita_ui_alpha_probe_regression.py
          python3 tools/vita_audio_mixer_regression.py
          python3 tools/vita_menu_audio_regression.py
          python3 tools/vita_lru_dispose_regression.py
          python3 tools/vita_cache_regression.py
          python3 tools/vita_resource_seek_regression.py
          python3 tools/vita_stream_regression.py
          python3 tools/vita_renderer_contract_regression.py
          python3 tools/vita_ui_render_contract_regression.py

  vita:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4
      - name: Configure Vita target
        run: cmake -S port/vita -B build/vita -G Ninja
      - name: Link Vita ELF
        run: cmake --build build/vita --target HaloCE.elf -j2
      - name: Inspect Vita ELF LOAD layout
        run: |
          arm-vita-eabi-readelf -lS build/vita/HaloCE.elf
          echo "===== init/fini/data map placement ====="
          grep -E '^\.(init_array|fini_array|data|bss)[[:space:]]' build/vita/HaloCE.elf.map || true
      - name: Build VPK
        run: cmake --build build/vita --target vita_vpk -j2
      - name: Verify native renderer and Vita package
        run: python3 tools/vita_verify.py
      - name: Upload Vita test package and symbols
        uses: actions/upload-artifact@v4
        with:
          name: HaloCEVita-main-${{ github.sha }}
          path: |
            build/vita/HaloCE.vpk
            build/vita/HaloCE.elf
            build/vita/HaloCE.elf.map
            build/vita/artifacts.json
            build/vita/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  prerelease:
    name: Publish Vita pre-release
    needs: [vita, menu-audio-contracts]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Vita package
        uses: actions/download-artifact@v4
        with:
          name: HaloCEVita-main-${{ github.sha }}
          path: release
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vita-build-${{ github.run_number }}
          name: HaloCEVita Vita Build #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/HaloCE.vpk
            release/HaloCE.elf
            release/HaloCE.elf.map

  renderer-closure:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4
      - name: Discover renderer symbol owners
        run: |
          for symbol in rasterizer_preinitialize memory_watch_initialize rasterizer_error renderstate_table texturestagestate_table texture_table global_d3d_caps rasterizer_screen_effects_initialize rasterizer_debug_begin rasterizer_memory_pool_initialize rasterizer_dynamic_geometry_initialize rasterizer_transparent_geometry_initialize rasterizer_vertex_shaders_initialize rasterizer_debug_initialize rasterizer_detail_objects_initialize rasterizer_profile_initialize rasterizer_environment_fog_screen_initialize; do
            echo "===== ${symbol} ====="
            grep -Rsn --include='*.c' --include='*.h' "${symbol}" source port/linux/src port/linux/include port/vita/src port/vita/include | head -40 || true
          done
      - name: Configure original UI renderer/update link probe
        run: cmake -S port/vita -B build/vita-render-probe -G Ninja -DHALO_VITA_MENU_RENDER_PROBE=ON -DHALO_VITA_MENU_UPDATE_PROBE=ON
      - name: Link original UI renderer/update closure
        id: renderer_link
        shell: bash
        run: |
          set -o pipefail
          cmake --build build/vita-render-probe --target HaloCE.elf -j2 2>&1 | tee build/vita-render-probe/renderer-closure-link.log
      - name: Upload renderer closure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-closure-${{ github.sha }}
          path: |
            build/vita-render-probe/renderer-closure-link.log
            build/vita-render-probe/HaloCE.elf.map
          if-no-files-found: warn
          retention-days: 14