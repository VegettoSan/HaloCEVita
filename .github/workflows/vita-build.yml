name: Vita Build

on:
  push:
    branches: [main]
    paths:
      - "port/vita/**"
      - "port/linux/src/**"
      - "port/linux/include/**"
      - "source/**"
      # Documentation checkpoints must also produce an exact-main test package.
      - "docs/**"
      - "tools/vita_*.py"
      - "tools/fixtures/vita_cache_worker_*"
      - ".github/workflows/vita-build.yml"
  workflow_dispatch:

jobs:
  menu-audio-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check original texture and 2D sound contracts
        run: |
          python3 tools/vita_original_frame_regression.py
          python3 tools/vita_bootstrap_regression.py
          python3 tools/vita_texture_stage_regression.py
          python3 tools/vita_texture_upload_regression.py
          python3 tools/vita_dxt_mask_regression.py
          python3 tools/vita_vertex_color_regression.py
          python3 tools/vita_menu_clock_regression.py
          python3 tools/vita_sound_tag_regression.py
          python3 tools/vita_menu_regression.py
          python3 tools/vita_ui_input_regression.py
          python3 tools/vita_ui_effects_regression.py
          python3 tools/vita_ui_shell_regression.py
          python3 tools/vita_xapi_regression.py
          python3 tools/vita_file_completion_regression.py
          python3 tools/vita_ui_alpha_probe_regression.py
          python3 tools/vita_audio_mixer_regression.py
          python3 tools/vita_menu_audio_regression.py
          python3 tools/vita_lru_dispose_regression.py
          python3 tools/vita_cache_regression.py
          python3 tools/vita_original_cache_regression.py
          python3 tools/vita_original_cache_owner_regression.py
          python3 tools/vita_text_pointer_regression.py
          python3 tools/vita_widget_pointer_regression.py
          python3 tools/vita_resource_seek_regression.py
          python3 tools/vita_stream_regression.py
          python3 tools/vita_renderer_contract_regression.py
          python3 tools/vita_nv2a_position_regression.py
          python3 tools/vita_shader_uniform_regression.py
          python3 tools/vita_program_regression.py
          python3 tools/vita_index_base_regression.py
          python3 tools/vita_draw_target_regression.py
          python3 tools/vita_ui_render_contract_regression.py
          python3 tools/vita_original_ui_lifecycle_regression.py

  vita:
    name: Vita menu renderer build
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4
      - name: Configure Vita target with original menu renderer
        run: cmake -S port/vita -B build/vita -G Ninja
      - name: Link Vita ELF and menu renderer closure
        run: cmake --build build/vita --target HaloCE.elf -j2
      - name: Inspect Vita ELF LOAD layout
        run: |
          arm-vita-eabi-readelf -lS build/vita/HaloCE.elf
          echo "===== init/fini/data map placement ====="
          grep -E '^\.(init_array|fini_array|data|bss)[[:space:]]' build/vita/HaloCE.elf.map || true
      - name: Build VPK
        run: cmake --build build/vita --target vita_vpk -j2
      - name: Verify native renderer and Vita package
        run: python3 tools/vita_verify.py
      - name: Upload Vita test package and symbols
        uses: actions/upload-artifact@v4
        with:
          name: HaloCEVita-main-${{ github.sha }}
          path: |
            build/vita/HaloCE.vpk
            build/vita/HaloCE.elf
            build/vita/HaloCE.elf.map
            build/vita/artifacts.json
            build/vita/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  prerelease:
    name: Publish Vita pre-release
    needs: [vita, menu-audio-contracts]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Vita package
        uses: actions/download-artifact@v4
        with:
          name: HaloCEVita-main-${{ github.sha }}
          path: release
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vita-build-${{ github.run_number }}
          name: HaloCEVita Vita Build #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/HaloCE.vpk
            release/HaloCE.elf
            release/HaloCE.elf.map
